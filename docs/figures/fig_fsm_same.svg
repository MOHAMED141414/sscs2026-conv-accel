<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1a3a5c"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1c7293"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#ffffff"/>

  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a5c">
    SAME-Padding Design — Control FSMs
  </text>
  <text x="490" y="49" text-anchor="middle" font-size="11" fill="#666">
    conv_top_same · main FSM (4 states) drives the core · separate TX FSM drains the output FIFO independently
  </text>

  <!-- ============ MAIN FSM (left/top) ============ -->
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1a3a5c">Main FSM — feeds the core</text>

  <!-- S_COEF -->
  <ellipse cx="150" cy="160" rx="64" ry="36" fill="#eef2f6" stroke="#1a3a5c" stroke-width="1.8"/>
  <text x="150" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">S_COEF</text>
  <text x="150" y="173" text-anchor="middle" font-size="9" fill="#555">load 9 coeffs</text>

  <!-- S_STREAM -->
  <ellipse cx="400" cy="160" rx="72" ry="36" fill="#eef2f6" stroke="#1a3a5c" stroke-width="1.8"/>
  <text x="400" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">S_STREAM</text>
  <text x="400" y="173" text-anchor="middle" font-size="9" fill="#555">feed real pixels only</text>

  <!-- S_FLUSH -->
  <ellipse cx="660" cy="160" rx="64" ry="36" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.8"/>
  <text x="660" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">S_FLUSH</text>
  <text x="660" y="173" text-anchor="middle" font-size="9" fill="#555">await TX drain</text>

  <!-- S_DONE -->
  <ellipse cx="870" cy="160" rx="64" ry="36" fill="#eef2f6" stroke="#1a3a5c" stroke-width="2.6"/>
  <ellipse cx="870" cy="160" rx="58" ry="30" fill="none" stroke="#1a3a5c" stroke-width="1"/>
  <text x="870" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">S_DONE</text>
  <text x="870" y="173" text-anchor="middle" font-size="9" fill="#555">done_led = 1</text>

  <!-- reset -->
  <line x1="40" y1="160" x2="86" y2="160" stroke="#1a3a5c" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="40" y="150" font-size="10" fill="#1a3a5c" font-weight="bold">rst</text>

  <!-- self loops -->
  <path d="M128 138 A 26 26 0 1 1 172 138" fill="none" stroke="#1a3a5c" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="150" y="78" text-anchor="middle" font-size="9" fill="#444">rx_valid &amp; cnt &lt; 9</text>

  <path d="M362 138 A 26 26 0 1 1 438 138" fill="none" stroke="#1a3a5c" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="400" y="78" text-anchor="middle" font-size="9" fill="#444">rx_valid &amp; pix_cnt &lt; NPIX-1</text>

  <!-- transitions -->
  <g stroke="#1a3a5c" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M214 160 H 328"/>
    <path d="M472 160 H 596"/>
  </g>
  <g stroke="#c0392b" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M724 160 H 806"/>
  </g>

  <text x="271" y="150" text-anchor="middle" font-size="9.5" fill="#1a3a5c">cnt = 9</text>
  <text x="271" y="164" text-anchor="middle" font-size="8.5" fill="#777">all coeffs loaded</text>

  <text x="534" y="150" text-anchor="middle" font-size="9.5" fill="#1a3a5c">pix_cnt = NPIX-1</text>
  <text x="534" y="164" text-anchor="middle" font-size="8.5" fill="#777">last real pixel fed</text>

  <text x="765" y="150" text-anchor="middle" font-size="9.5" fill="#c0392b">tx_out_cnt = NPIX</text>
  <text x="765" y="164" text-anchor="middle" font-size="8.5" fill="#777">all results drained</text>

  <!-- S_DONE loop back -->
  <path d="M870 196 C 870 260, 150 260, 150 196" fill="none" stroke="#1a3a5c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="500" y="252" text-anchor="middle" font-size="9.5" fill="#1a3a5c">done_led=1, frame_rst pulsed, immediately re-enter S_COEF</text>
  <text x="500" y="266" text-anchor="middle" font-size="8.5" fill="#777">no hardware reset needed for the next kernel</text>

  <!-- key note box -->
  <rect x="40" y="300" width="900" height="72" rx="6" fill="#eef2f6" stroke="#9aa8b6" stroke-width="1"/>
  <text x="60" y="322" font-size="11" font-weight="bold" fill="#1a3a5c">No padding states.</text>
  <text x="60" y="340" font-size="10.5" fill="#333">
    S_STREAM feeds only the NPIX=1024 real pixels — zero padding pixels are ever placed on the wire. Zero-padding is handled
  </text>
  <text x="60" y="356" font-size="10.5" fill="#333">
    entirely inside conv_accel_same (line-buffer reset timing for top rows, column masking for left edges) — see block diagram.
  </text>

  <!-- ============ TX / FIFO FSM (bottom) ============ -->
  <text x="60" y="410" font-size="13" font-weight="bold" fill="#1c7293">TX FSM — drains the output FIFO, runs independently of the main FSM</text>

  <!-- TX_IDLE / wait for data -->
  <ellipse cx="180" cy="490" rx="70" ry="36" fill="#e8f2f5" stroke="#1c7293" stroke-width="1.8"/>
  <text x="180" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c7293">await HI</text>
  <text x="180" y="503" text-anchor="middle" font-size="9" fill="#555">FIFO not empty</text>

  <!-- TX_HI -->
  <ellipse cx="430" cy="490" rx="70" ry="36" fill="#e8f2f5" stroke="#1c7293" stroke-width="1.8"/>
  <text x="430" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c7293">send HI</text>
  <text x="430" y="503" text-anchor="middle" font-size="9" fill="#555">bits 15:8</text>

  <!-- TX_LO -->
  <ellipse cx="680" cy="490" rx="70" ry="36" fill="#e8f2f5" stroke="#1c7293" stroke-width="1.8"/>
  <text x="680" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c7293">send LO</text>
  <text x="680" y="503" text-anchor="middle" font-size="9" fill="#555">bits 7:0, pop FIFO</text>

  <g stroke="#1c7293" stroke-width="1.6" fill="none" marker-end="url(#ag)">
    <path d="M250 490 H 360"/>
    <path d="M500 490 H 610"/>
  </g>
  <path d="M680 526 C 680 555, 180 555, 180 526" fill="none" stroke="#1c7293" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>

  <text x="305" y="480" text-anchor="middle" font-size="9.5" fill="#1c7293">fifo not empty</text>
  <text x="305" y="494" text-anchor="middle" font-size="8.5" fill="#777">&amp; tx_out_cnt &lt; NPIX</text>

  <text x="555" y="480" text-anchor="middle" font-size="9.5" fill="#1c7293">tx_done</text>

  <text x="430" y="574" text-anchor="middle" font-size="9.5" fill="#1c7293">tx_done — tx_out_cnt++, f_rd++</text>

  <!-- FIFO box -->
  <rect x="820" y="454" width="130" height="72" rx="6" fill="#ffffff" stroke="#1c7293" stroke-width="1.6"/>
  <text x="885" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#1c7293">Output FIFO</text>
  <text x="885" y="492" text-anchor="middle" font-size="9.5" fill="#555">depth 32</text>
  <text x="885" y="507" text-anchor="middle" font-size="9.5" fill="#555">distributed RAM</text>
  <line x1="750" y1="490" x2="818" y2="490" stroke="#1c7293" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#ag)"/>

  <!-- notes -->
  <line x1="40" y1="600" x2="940" y2="600" stroke="#c8d2dc" stroke-width="1"/>
  <text x="40" y="620" font-size="10" font-weight="bold" fill="#1a3a5c">Why two independent FSMs</text>
  <text x="40" y="638" font-size="10.5" fill="#555">
    The core can retire one result every clock cycle, far faster than the UART can transmit two bytes per result. The output FIFO
  </text>
  <text x="40" y="654" font-size="10.5" fill="#555">
    decouples the core's cycle-accurate cadence from the UART's byte-at-a-time drain rate, so the zero-gap guarantee at the core
  </text>
  <text x="40" y="670" font-size="10.5" fill="#555">
    is never compromised by how slowly the host can read results back.
  </text>
  <text x="40" y="690" font-size="9.5" fill="#c0392b">
    frame_rst clears f_wr, f_cnt, f_rd, and tx_out_cnt together with the main FSM's counters — all state resets atomically between kernel passes.
  </text>
</svg>
